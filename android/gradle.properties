org.gradle.jvmargs=-Xmx4608m
android.useAndroidX=true
android.enableJetifier=true
# 12 核机器：开满并行 worker（3 ABI 的 native 任务 + Kotlin/打包并行）
org.gradle.parallel=true
org.gradle.workers.max=12

# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false

# TEMP(windows build): pub cache (C:) and project (E:) are on different drives;
# Kotlin incremental compilation cannot compute relative paths across roots.
kotlin.incremental=false
